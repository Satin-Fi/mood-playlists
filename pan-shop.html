<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pan Shop | Mood Playlists</title>
    <meta name="description" content="Pan Shop mood — coming soon to Mood Playlists." />
    <meta name="theme-color" content="#1a3020" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="mood.css" />
    <link rel="stylesheet" href="coming-soon.css" />
  </head>
  <body class="mood-pan-shop">
    <div class="bg" aria-hidden="true"><div class="bg__layer bg__layer--1 is-active"></div><div class="bg__scrim"></div></div>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <div class="topbar-start"><a class="home" href="index.html">All moods</a><div class="clock" id="clock"></div></div>
      <div class="presence" aria-live="polite"><span class="presence__dot"></span><span class="presence__count" id="listeners">186</span><span class="presence__label">by the stall</span></div>
      <nav class="links" aria-label="Site links"></nav>
    </header>
    <main>
      <h1 class="logo">Pan Shop</h1>
      <div class="dock">
        <section class="coming-soon" aria-label="Coming soon">
          <p class="coming-soon__tag">Coming soon</p>
          <h2 class="coming-soon__title">Pan Shop</h2>
          <p class="coming-soon__text">Betel leaf, neon signs, and corner-shop gossip. Playlist loading soon.</p>
        </section>
      </div>
    </main>
    <script>window.MOOD_CONFIG={moodId:'pan-shop',pageTitle:'Pan Shop'};</script>
    <script src="mood-shell.js"></script>
    <script>document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase();</script>
  </body>
</html>
