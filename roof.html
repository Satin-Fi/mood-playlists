<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roof | Mood Playlists</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #14213D;
            --secondary: #FFD54F;
            --accent: #FFF3E0;
            --accent-muted: rgba(255, 213, 79, 0.1);

            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover-border: rgba(255, 255, 255, 0.18);

            --text: #FFF8E1;
            --text-muted: rgba(255, 248, 225, 0.6);
            --text-subtle: rgba(255, 248, 225, 0.25);

            --backdrop-blur: 24px;
            --radius-lg: 28px;
            --radius-md: 16px;

            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.07);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background-color: var(--primary);
            min-height: 100vh;
        }

        /* ── Background layer ── */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: url('images/roof.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(ellipse 70% 50% at 50% 80%,
                    rgba(20, 33, 61, 0.25) 0%,
                    rgba(20, 33, 61, 0.55) 70%,
                    rgba(20, 33, 61, 0.75) 100%
                ),
                linear-gradient(180deg,
                    transparent 0%,
                    rgba(20, 33, 61, 0.3) 50%,
                    rgba(20, 33, 61, 0.6) 100%
                );
        }

        /* Twinkling stars */
        .stars {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50%      { opacity: 1;   transform: scale(1.2); }
        }

        /* ── Content ── */
        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            animation: fade-in 0.9s ease-out;
        }

        .hero {
            text-align: center;
            max-width: 780px;
            width: 100%;
        }

        .mood-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 8px 20px;
            border-radius: 999px;
            background: var(--accent-muted);
            border: 1px solid var(--glass-border);
            color: var(--accent);
            margin-bottom: 24px;
            animation: fade-slide-up 0.7s 0.2s both;
            backdrop-filter: blur(var(--backdrop-blur));
        }

        .title {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
            font-size: clamp(3rem, 8vw, 5.5rem);
            line-height: 1.05;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            text-shadow: 0 4px 60px rgba(0, 0, 0, 0.6);
            animation: fade-slide-up 0.8s 0.3s both;
        }

        .subtitle {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 40px;
            animation: fade-slide-up 0.8s 0.4s both;
        }

        .divider {
            width: 60px;
            height: 2px;
            margin: 32px auto;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--secondary), transparent);
            animation: fade-slide-up 0.7s 0.5s both;
        }

        /* ── Glass card ── */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--backdrop-blur));
            -webkit-backdrop-filter: blur(var(--backdrop-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glass);
            padding: 24px;
            width: 100%;
            max-width: 800px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.35s ease;
            animation: fade-slide-up 0.8s 0.55s both;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--glass-hover-border);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: rgba(0,0,0,0.3);
        }

        .video-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── Back button ── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            color: var(--text);
            text-decoration: none;
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 12px 24px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fade-slide-up 0.7s 0.7s both;
        }

        .back-link:hover {
            background: rgba(255,248,225,0.08);
            border-color: var(--glass-hover-border);
            transform: translateX(-3px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .back-link svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .back-link:hover svg {
            transform: translateX(-3px);
        }

        /* ── Footer ── */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 24px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-subtle);
            letter-spacing: 0.02em;
            z-index: 10;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--accent);
        }

        /* ── Animations ── */
        @keyframes fade-in {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fade-slide-up {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float-gentle {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .content { padding: 32px 16px; }
            .glass-card { padding: 16px; }
            .title { letter-spacing: -0.01em; }
            .stars { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .content, .mood-tag, .title, .subtitle, .divider,
            .glass-card, .back-link, .footer, .stars {
                animation: none !important;
                transition: none !important;
            }
            .glass-card:hover { transform: none !important; }
        }
    </style>
</head>
<body>
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="bg-overlay" aria-hidden="true"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <main class="content">
        <div class="hero">
            <span class="mood-tag">Night Sky</span>

            <h1 class="title">Roof</h1>
            <p class="subtitle">City lights below and stars above — the quiet magic of open rooftops where conversations stretch into the warm hours of the night.</p>

            <div class="divider" aria-hidden="true"></div>

            <div class="glass-card">
                <div class="video-wrapper">
                    <!-- Replace with your Roof playlist ID -->
                    <iframe
                        src="https://www.youtube.com/embed/videoseries?list=YOUR_ROOF_PLAYLIST_ID&rel=0&modestbranding=1&playsinline=1&showinfo=0"
                        title="Roof Playlist"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen
                        loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </main>

    <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        All Moods
    </a>

    <footer class="footer">
        <span>&copy; 2026 Mood Playlists &middot; </span>
        <a href="index.html">Mood Suite</a>
    </footer>

    <script>
        (function createStars() {
            const container = document.getElementById('stars');
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const count = Math.min(80, Math.floor(window.innerWidth / 12));
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const x = Math.random() * 100;
                const y = Math.random() * 60; // keep in upper half-ish
                const size = 1 + Math.random() * 2;
                const duration = 2 + Math.random() * 3;
                const delay = Math.random() * duration;
                star.style.cssText = [
                    `left: ${x}%`,
                    `top: ${y}%`,
                    `width: ${size}px`,
                    `height: ${size}px`,
                    `animation-duration: ${duration}s`,
                    `animation-delay: ${delay}s`,
                    `opacity: ${0.3 + Math.random() * 0.5}`
                ].join('; ');
                container.appendChild(star);
            }
        })();
    </script>
</body>
</html>
